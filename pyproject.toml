[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "AstraFold"
version = "0.1.0"

[tool.setuptools.packages.find]
include = ["astrafold*"]

[tool.setuptools.package-data]
astrafold = ["py.typed"]

[[tool.mypy.overrides]]
module = ["tree"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["wandb", "outputs"]
