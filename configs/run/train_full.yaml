# @package _global_
# Full training run.
# Usage: python3 train.py run=train_full
data_cfg:
  # 90/10 split of RNA3DB_train.csv, made by scripts/make_val_split.py
  csv_path: metadata/RNA3DB_train_split.csv
  val_csv_path: metadata/RNA3DB_val.csv

experiment:
  trainer:
    devices: [0, 1, 2, 3]
    # Run length is set in steps: the batcher's "epoch" is a fixed
    # ceil(num_train_rnas / num_gpus) steps per GPU (126 with the 504-RNA split)
    # regardless of batch size, so epochs don't map to passes over the data.
    # Validation runs at the end of every such epoch.
    max_steps: 120_000
    max_epochs: -1
    # Anomaly detection makes a step about 7x slower (CPU-bound stack traces and
    # NaN checks). Turn it back on to find the operation behind a NaN.
    detect_anomaly: False
  checkpointer:
    monitor: valid/loss # keep the checkpoints with the lowest validation loss
  optimizer: 
    lr: 0.00001
  wandb:
    project: AstraFold
    name: full_4gpu
