# @package _global_
# Full training run.
# Usage: python3 train.py run=train_full
data_cfg:
  csv_path: metadata/RNA3DB_train.csv

experiment:
  trainer:
    devices: [0, 1, 2, 3]
    # Run length is set in steps: the batcher's "epoch" is a fixed 140 steps per GPU
    # regardless of batch size, so epochs don't map to passes over the data.
    max_steps: 120_000
    max_epochs: -1
  optimizer: 
    lr: 0.00001
  wandb:
    project: RNAbpFlow_train
    name: full_4gpu
