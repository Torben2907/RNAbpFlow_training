# Overfit smoke test on a single batch. Builds on config.yaml.
# Usage: python3 train.py --config-name=smoke_overfit
defaults:
  - config
  - _self_

data_cfg:
  csv_path: metadata/RNA3DB_train.csv

experiment:
  training:
    smoke_test_seed: 0
    aux_loss_t_pass: 0.0
  trainer:
    devices: [0, 3]
    overfit_batches: 1
    max_epochs: 500
  wandb:
    project: train
    name: smoke_overfit_2gpu
