# Pinned export of the AstraFold conda environment (conda env export --no-builds, 2026-11-16).
# Create with:  conda env create -f requirements.yaml && conda activate AstraFold && pip install -e .
# Left out: the astrafold package itself (installed editable via `pip install -e .`) and an unused
# CUDA 13 wheel stack (nvidia-*, cuda-*) nothing depends on; torch uses its bundled CUDA 11.8.
